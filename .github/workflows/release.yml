name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 2.46.0). Defaults to the latest upstream yonaskolb/XcodeGen release.
        required: false
        type: string
  push:
    tags:
      - "v*"
env:
  GIT_TERMINAL_PROMPT: 0
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift-linux
        with:
          swift-version: "6.3.3"
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(gh api repos/yonaskolb/XcodeGen/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build release binary
        run: make build-linux
      - name: Strip debug info
        run: strip --strip-debug "$(swift build -c release --show-bin-path)/xcodegen"
      - name: Smoke test
        run: BIN="$(swift build -c release --show-bin-path)/xcodegen" && "$BIN" --version
      - name: Package tarball and raw binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp "$(swift build -c release --show-bin-path)/xcodegen" dist/xcodegen
          tar -C dist -czf "xcodegen-${VERSION}-linux-${ARCH}.tar.gz" xcodegen
          # raw binary asset for direct download / aqua format:raw installs
          cp "$(swift build -c release --show-bin-path)/xcodegen" "dist/xcodegen-${VERSION}-linux-${ARCH}"
          rm dist/xcodegen
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodegen-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: xcodegen-linux-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum xcodegen-*.tar.gz > "xcodegen-${VERSION}-checksums.txt"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: XcodeGen ${{ needs.build.outputs.version }} (Linux)
          body: |
            Linux binaries for XcodeGen v${{ needs.build.outputs.version }} (upstream: yonaskolb/XcodeGen). Self-contained static build - no Swift runtime required. Assets: tar.gz (aqua), raw binary, sha256 checksums. Attestations attached for supply-chain verification.
          generate_release_notes: true
          files: dist/xcodegen-*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
