name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 2.46.0). Defaults to the latest upstream yonaskolb/XcodeGen release.
        required: false
        type: string
  push:
    tags:
      - "v*"
env:
  GIT_TERMINAL_PROMPT: 0
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Install Static Linux SDK
        run: |
          swift sdk install "https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if [[ -z "${VERSION}" ]]; then
            # container jobs run as root while actions/checkout creates the
            # workspace on the host (owned by the runner user) — trust it
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            git fetch --quiet --tags --force https://github.com/yonaskolb/XcodeGen.git
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install make
        # the swift image ships without make — install via distro package manager
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Build release binary (static)
        run: make build-linux-static
      - name: Smoke test
        run: |
          BIN="$(make -s build-linux-static-bin-path)/xcodegen"
          "$BIN" --version
      - name: Package tarball and raw binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          BIN="$(make -s build-linux-static-bin-path)/xcodegen"
          mkdir -p dist
          cp "$BIN" dist/xcodegen
          cp -R SettingPresets dist/SettingPresets
          tar -czf "dist/xcodegen-${VERSION}-linux-${ARCH}.tar.gz" -C dist xcodegen SettingPresets
          cp dist/xcodegen "dist/xcodegen-${VERSION}-linux-${ARCH}"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodegen-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: xcodegen-linux-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          chmod +x xcodegen-*-linux-*
          sha256sum xcodegen-* > "xcodegen-${VERSION}-checksums.txt"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: XcodeGen ${{ needs.build.outputs.version }} (Linux)
          body: |
            ## Linux binaries

            Self-contained, statically-linked XcodeGen builds for Linux — no Swift toolchain required at runtime.

            ### Assets

            | Asset | Arch | Format |
            | --- | --- | --- |
            | `xcodegen-${{ needs.build.outputs.version }}-linux-x86_64.tar.gz` | x86_64 | tarball (binary + `SettingPresets/`) |
            | `xcodegen-${{ needs.build.outputs.version }}-linux-aarch64.tar.gz` | aarch64 | tarball (binary + `SettingPresets/`) |
            | `xcodegen-${{ needs.build.outputs.version }}-linux-x86_64` | x86_64 | raw binary |
            | `xcodegen-${{ needs.build.outputs.version }}-linux-aarch64` | aarch64 | raw binary |
            | `xcodegen-${{ needs.build.outputs.version }}-checksums.txt` | — | SHA-256 checksums |

            ### Install

            ```bash
            VERSION=${{ needs.build.outputs.version }}
            ARCH=$(uname -m)

            # Download and extract
            curl -fsSL -o xcodegen.tar.gz "https://github.com/sabafshin/XcodeGen/releases/download/v${VERSION}/xcodegen-${VERSION}-linux-${ARCH}.tar.gz"
            tar xzf xcodegen.tar.gz
            sudo install xcodegen /usr/local/bin/
            ```

            ### Verify

            ```bash
            VERSION=${{ needs.build.outputs.version }}

            # Checksums
            curl -fsSL -O "https://github.com/sabafshin/XcodeGen/releases/download/v${VERSION}/xcodegen-${VERSION}-checksums.txt"
            sha256sum -c "xcodegen-${VERSION}-checksums.txt"

            # SLSA provenance (Sigstore)
            gh attestation verify "xcodegen-${VERSION}-checksums.txt" --repo sabafshin/XcodeGen
            ```

            ### Security

            - Fully static musl build (Swift Static Linux SDK) — zero dynamic dependencies, no runtime libs required
            - `BIND_NOW` (full RELRO), no executable stack
            - Every asset is covered by a Sigstore-signed SLSA build-provenance attestation

            Upstream source: [yonaskolb/XcodeGen](https://github.com/yonaskolb/XcodeGen) (macOS binaries are published upstream).
          generate_release_notes: false
          files: dist/xcodegen-*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
