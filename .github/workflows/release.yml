name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 2.46.0). Defaults to the latest upstream yonaskolb/XcodeGen release.
        required: false
        type: string
  push:
    tags:
      - "v*"
env:
  GIT_TERMINAL_PROMPT: 0
permissions:
  contents: read
jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.3.3"
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(gh api repos/yonaskolb/XcodeGen/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build release binary
        run: make build-linux
      - name: Strip debug info
        run: strip --strip-debug "$(swift build -c release --show-bin-path)/xcodegen"
      - name: Smoke test
        run: BIN="$(swift build -c release --show-bin-path)/xcodegen" && "$BIN" --version
      - name: Package tarball
        run: |
          mkdir -p dist
          cp "$(swift build -c release --show-bin-path)/xcodegen" dist/xcodegen
          tar -C dist -czf "xcodegen-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" xcodegen
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodegen-linux-${{ matrix.arch }}
          path: xcodegen-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION="$(gh api repos/yonaskolb/XcodeGen/releases/latest --jq .tag_name | sed 's/^v//')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: xcodegen-linux-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum xcodegen-*.tar.gz > "xcodegen-${{ steps.version.outputs.version }}-checksums.txt"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --title "XcodeGen ${{ steps.version.outputs.version }} (Linux)" \
            --notes "Linux binaries for XcodeGen v${{ steps.version.outputs.version }} (upstream: yonaskolb/XcodeGen). Self-contained static build - no Swift runtime required." \
            xcodegen-*.tar.gz "xcodegen-${{ steps.version.outputs.version }}-checksums.txt"
