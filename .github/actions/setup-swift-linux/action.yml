name: Setup Swift (Linux)
description: Install a pinned Swift toolchain (and optional Static Linux SDK) via swiftly from download.swift.org.
inputs:
  swift-version:
    description: Swift toolchain version to install (e.g. 6.3.3)
    required: false
    default: "6.3.3"
  swiftly-version:
    description: swiftly version to bootstrap with
    required: false
    default: "1.1.3"
  install-static-sdk:
    description: Install the Swift Static Linux SDK (for fully static binaries)
    required: false
    default: "false"
outputs:
  swift-location:
    description: Path to the installed Swift toolchain (root)
    value: ${{ steps.location.outputs.location }}
runs:
  using: composite
  steps:
    - name: Install swiftly
      shell: bash
      env:
        SWIFTLY_VERSION: ${{ inputs.swiftly-version }}
      run: |
        set -euo pipefail
        ARCH="$(uname -m)"
        URL="https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${ARCH}.tar.gz"
        echo "Downloading swiftly ${SWIFTLY_VERSION} (${ARCH})"
        # Retry with backoff: GitHub-hosted runners occasionally fail to reach
        # download.swift.org (curl exit 2); arm64/amd64 runner pools differ
        for attempt in 1 2 3; do
          if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "${RUNNER_TEMP}/swiftly.tar.gz" "${URL}"; then
            break
          fi
          echo "Download failed (attempt ${attempt}/3), retrying..." >&2
          sleep $((attempt * 5))
        done
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "${RUNNER_TEMP}/swiftly.tar.gz.sig" "${URL}.sig"
        curl -fsSL https://swift.org/keys/all-keys.asc | gpg --import --batch >/dev/null 2>&1
        gpg --batch --verify "${RUNNER_TEMP}/swiftly.tar.gz.sig" "${RUNNER_TEMP}/swiftly.tar.gz"
        sudo tar xzf "${RUNNER_TEMP}/swiftly.tar.gz" -C /usr/local/bin
    - name: Init swiftly
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        swiftly init --skip-install --assume-yes --quiet-shell-followup --no-modify-profile
    - name: Install Swift toolchain
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        POST_INSTALL="${RUNNER_TEMP}/swiftly-post-install.sh"
        swiftly install --use "${SWIFT_VERSION}" --assume-yes --post-install-file "${POST_INSTALL}"
        if [[ -f "${POST_INSTALL}" ]]; then
          # runs as root to install toolchain deps via apt-get
          sudo bash "${POST_INSTALL}"
        fi
    - name: Install Static Linux SDK
      if: inputs.install-static-sdk == 'true'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        STATIC_SDK_VERSION: "0.1.0"
        STATIC_SDK_CHECKSUM: "87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b"
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_static-linux-${STATIC_SDK_VERSION}.artifactbundle.tar.gz"
        echo "Installing Static Linux SDK ${STATIC_SDK_VERSION}"
        swift sdk install "${URL}" --checksum "${STATIC_SDK_CHECKSUM}"
    - name: Resolve toolchain location and add to PATH
      id: location
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        LOCATION="$(swiftly use --print-location)"
        echo "location=${LOCATION}" >> "${GITHUB_OUTPUT}"
        echo "${LOCATION}/usr/bin" >> "${GITHUB_PATH}"
        echo "Swift location: ${LOCATION}"
