name: Setup Swift (Linux)
description: Install a pinned Swift toolchain via swiftly from download.swift.org.
inputs:
  swift-version:
    description: Swift toolchain version to install (e.g. 6.3.3)
    required: false
    default: "6.3.3"
  swiftly-version:
    description: swiftly version to bootstrap with
    required: false
    default: "1.1.3"
outputs:
  swift-location:
    description: Path to the installed Swift toolchain (root)
    value: ${{ steps.location.outputs.location }}
runs:
  using: composite
  steps:
    - name: Install swiftly
      shell: bash
      env:
        SWIFTLY_VERSION: ${{ inputs.swiftly-version }}
      run: |
        set -euo pipefail
        ARCH="$(uname -m)"
        URL="https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${ARCH}.tar.gz"
        echo "Downloading swiftly ${SWIFTLY_VERSION} (${ARCH})"
        curl -fsSL -o "${RUNNER_TEMP}/swiftly.tar.gz" "${URL}"
        curl -fsSL -o "${RUNNER_TEMP}/swiftly.tar.gz.sig" "${URL}.sig"
        curl -fsSL https://swift.org/keys/all-keys.asc | gpg --import --batch >/dev/null 2>&1
        gpg --batch --verify "${RUNNER_TEMP}/swiftly.tar.gz.sig" "${RUNNER_TEMP}/swiftly.tar.gz"
        sudo tar xzf "${RUNNER_TEMP}/swiftly.tar.gz" -C /usr/local/bin
    - name: Init swiftly
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        swiftly init --skip-install --assume-yes --quiet-shell-followup --no-modify-profile
    - name: Install Swift toolchain
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        POST_INSTALL="${RUNNER_TEMP}/swiftly-post-install.sh"
        swiftly install --use "${SWIFT_VERSION}" --assume-yes --post-install-file "${POST_INSTALL}"
        if [[ -f "${POST_INSTALL}" ]]; then
          # runs as root to install toolchain deps via apt-get
          sudo bash "${POST_INSTALL}"
        fi
    - name: Resolve toolchain location and add to PATH
      id: location
      shell: bash
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:${PATH}"
        LOCATION="$(swiftly use --print-location)"
        echo "location=${LOCATION}" >> "${GITHUB_OUTPUT}"
        echo "${LOCATION}/usr/bin" >> "${GITHUB_PATH}"
        echo "Swift location: ${LOCATION}"
